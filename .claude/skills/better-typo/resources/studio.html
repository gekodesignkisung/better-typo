<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>better-typo studio</title>
  <!-- 샘플 문서(캔버스) 전용 폰트 — 오프라인이면 아래 시스템 스택으로 폴백 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #ffffff; --panel: #fafbfc; --line: #ecedf0;
      --ink: #1a1d24; --muted: #8a909c; --accent: #2f6bdc; --good: #1f9d5b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ── 상단 바 (미니멀) ── */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 24px; border-bottom: 1px solid var(--line); background: #fff;
      flex: 0 0 auto;
    }
    .brandbox { display: flex; flex-direction: column; gap: 2px; line-height: 1.25; }
    .brand { font-weight: 700; font-size: 15px; color: var(--ink); letter-spacing: .01em; }
    .tagline { font-size: 11.5px; color: var(--muted); }
    .grow { flex: 1; }
    .btn {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .2s, background .2s;
    }
    .btn:hover { background: #2a60c4; }
    .btn:disabled { opacity: .45; cursor: default; }

    /* ── 본체 ── */
    .body { flex: 1; display: grid; grid-template-columns: 1fr 360px; min-height: 0; }

    /* 좌: 전체 흰 캔버스 */
    .canvasWrap { position: relative; background: #fff; overflow: auto; display: flex; justify-content: center; padding: 52px 48px; }
    .paper {
      --font-body: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --ink-title: #14161b; --ink-body: #2b2f37; --ink-sub: #5f6675; --ink-quote: #3f5d78; --ink-cap: #9aa1ad;
      position: relative; width: 100%; max-width: 760px; align-self: flex-start;
      background: #fff; color: var(--ink-body); font-family: var(--font-body);
      padding: 8px 4px 80px;
    }
    .paper[contenteditable="true"] { outline: none; }
    /* 빈 캔버스 placeholder — 입력이 비었을 때만 안내 예시를 연하게 */
    .paper.is-empty::before {
      content: attr(data-placeholder); white-space: pre-wrap;
      color: #b6bcc7; font-size: clamp(14px, 2vw, 15px); line-height: 1.7; pointer-events: none;
      display: block;
    }
    .sample-link, .clear-link {
      position: absolute; top: 18px; right: 22px; z-index: 4;
      background: #fff; color: var(--muted); border: 1px solid var(--line);
      border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer;
      transition: color .2s, border-color .2s, opacity .2s; display: none;
    }
    .sample-link:hover, .clear-link:hover { color: var(--accent); border-color: var(--accent); }
    /* 예시 버튼은 빈 캔버스일 때만 노출 */
    .canvasWrap:has(.paper.is-empty) .sample-link { display: block; }
    .post { transition: max-width .8s cubic-bezier(.22,1,.36,1); }

    /* 블록 기본(before): 위계 없음 — 모두 같은 크기·웨이트·균일 회색, 어절 중간 끊김 */
    .blk {
      font-size: 15px; line-height: 1.3; word-break: break-all; margin: 0 0 9px;
      color: #565b66; font-weight: 400; letter-spacing: 0; font-style: normal;
      font-family: var(--font-body);
      transition: font-size .85s cubic-bezier(.22,1,.36,1), line-height .85s cubic-bezier(.22,1,.36,1),
                  letter-spacing .85s cubic-bezier(.22,1,.36,1), margin .85s cubic-bezier(.22,1,.36,1),
                  padding .85s cubic-bezier(.22,1,.36,1), color .6s ease, border-color .6s ease;
    }
    .blk:last-child { margin-bottom: 0; }

    /* 전역 토글 */
    .paper.fix-keepall .blk { word-break: keep-all; overflow-wrap: break-word; }
    .paper.fix-measure .post { max-width: 40em; }   /* 한글 글자폭≈1em → 40자, 이상 대역 상단 (§3) */
    .paper.fix-leading .blk[data-role="body"], .paper.fix-leading .blk[data-role="caption"] { line-height: 1.78; }
    /* 라틴 위주 문서(doc-latin): measure·행간 기준을 라틴 대역으로 분기 (§3·§4) */
    .paper.doc-latin.fix-measure .post { max-width: 68ch; }   /* 라틴 50–75자, 이상적 66자 */
    .paper.doc-latin.fix-leading .blk[data-role="body"], .paper.doc-latin.fix-leading .blk[data-role="caption"] { line-height: 1.6; }
    .paper.fix-leading .blk[data-role="quote"] { line-height: 1.7; }
    .paper.fix-rhythm .blk[data-role="body"] { margin-bottom: 1.35em; }   /* 단락 세로 리듬 (§10) */

    /* 위계: 크기(§5) + 웨이트 + 명도(§9) + 폰트 페어링(§9)
       크기는 clamp()로 유체(fluid) 스케일 — 폭이 줄면 폰트도 부드럽게 작아진다.
       clamp(최소, 선호[뷰포트 연동], 최대): 데스크탑에선 최대, 모바일에선 최소로 수렴. */
    /* 크기는 본문 16px 기준 모듈러 스케일(1.25): 16 → 20(부제·소제목) → 32(제목 = 16×2) (§5) */
    .blk.on[data-role="title"]    { font-size: clamp(26px, 4.8vw, 36px); line-height: 1.18; letter-spacing: -0.02em; font-weight: 700; color: var(--ink-title); margin-bottom: 6px; }
    .blk.on[data-role="subtitle"] { font-size: clamp(17px, 2.5vw, 20px); line-height: 1.45; letter-spacing: -0.003em; font-weight: 600; color: var(--ink-sub); margin-bottom: clamp(20px, 4vw, 30px); }
    /* 소제목(섹션 heading): 부제와 반대로 본문보다 크고 굵고 진하게 + 위쪽 섹션 여백 (§5·§9) */
    .blk.on[data-role="heading"]  { font-size: clamp(17px, 2.5vw, 20px); line-height: 1.35; letter-spacing: -0.01em; font-weight: 700; color: var(--ink-title); margin: clamp(30px, 5.5vw, 48px) 0 10px; }
    /* 참고 목록(ref): 각주 관례 — 본문보다 작게·보조 명도·행잉 인덴트 (§5) */
    .blk.on[data-role="ref"]      { font-size: clamp(13px, 1.85vw, 14px); line-height: 1.55; font-weight: 400; color: var(--ink-sub); margin: 0 0 6px; padding-left: 1.1em; text-indent: -1.1em; }
    .blk.on[data-role="body"]     { font-size: 16px; font-weight: 400; color: var(--ink-body); margin-bottom: 18px; }
    /* 목록: 본문보다 좁은 행간 + 항목 간격 축소 + 행잉 인덴트로 한 덩어리 */
    /* 항목 간 0.55em — 항목끼리는 구분되고, 본문 단락 간격(1.35em)보다는 좁아 목록 전체가 한 묶음으로 읽힌다 */
    .blk.on[data-role="list"]     { font-size: 16px; line-height: 1.5; font-weight: 400; color: var(--ink-body); margin: 0 0 0.55em; padding-left: 1.3em; text-indent: -1.3em; }
    /* 목록 덩어리가 끝나고 다른 블록이 이어질 때: 단락급 여백으로 묶음 경계를 만든다 (§10) */
    .blk.on[data-role="list"] + .blk.on:not([data-role="list"]) { margin-top: 1.4em; }
    .blk.on[data-role="quote"]    { font-size: 15px; font-weight: 400; color: var(--ink-quote); border-left: 3px solid #cbd3dd; padding-left: clamp(16px, 3vw, 22px); margin: 28px 0; }
    .blk.on[data-role="caption"]  { font-size: clamp(13px, 2vw, 14.5px); font-weight: 500; color: var(--ink-cap); letter-spacing: 0.01em; margin-top: 24px; }
    /* 표제부 바이라인 뒤(마지막 블록이 아닐 때): 본문 시작과 섹션급 여백으로 분리 — 머리/몸 구분 (§10) */
    .blk.on[data-role="caption"]:not(:last-child) { margin-bottom: clamp(28px, 5vw, 44px); }
    /* 표제부 안에서는 부제~바이라인 간격을 좁혀 한 덩어리로 */
    .blk.on[data-role="subtitle"] + .blk.on[data-role="caption"] { margin-top: 10px; }

    /* 이미지 영역 제안 (레이아웃) */
    .imgph {
      margin: 26px 0; border: 1.5px dashed #c6ccd6; border-radius: 10px;
      background: repeating-linear-gradient(45deg, #f6f7f9, #f6f7f9 11px, #eef0f3 11px, #eef0f3 22px);
      aspect-ratio: 16 / 9; display: grid; place-items: center; color: #8a91a0; font-size: 13px;
      opacity: 0; transform: scale(.97);
      transition: opacity .55s ease, transform .55s cubic-bezier(.22,1,.36,1);
    }
    .imgph.show { opacity: 1; transform: none; }
    .imgph span { background: #fff; padding: 4px 12px; border-radius: 999px; border: 1px solid #e4e7ec; }

    /* 구조 식별 순간의 제목 프리뷰 — 식별과 동시에 제목답게 커진다 (정식 크기·자간은 위계 단계에서) */
    .blk.struct-title { font-size: 1.4em; line-height: 1.3; font-weight: 700; color: var(--ink-title); }

    /* 인라인 수정 강조 — 적용 순간 밝게 번쩍인 뒤, 바뀐 글자에는 옅은 하이라이트가 남는다 */
    .flash { animation: flash 1.1s ease; }
    @keyframes flash { 0%{ background:#ffe28a } 100%{ background:transparent } }
    .fixspan { transition: background .9s ease; }
    .fixspan.changed { background: rgba(250, 205, 80, .35); border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

    /* 선택 표시 (미니멀) — 라운드 없이 직각, 제목은 선 위에 딱 붙여.
       색은 단계(phase)별로 --sel 변수로 바뀐다(테두리·배지·그림자 동시). */
    .selbox {
      --sel: var(--accent);
      position: absolute; border: 1.5px solid var(--sel); border-radius: 0;
      background: color-mix(in srgb, var(--sel) 7%, transparent);   /* 내부: 단계 컬러의 밝은 투명톤 (모든 단계 공통) */
      pointer-events: none;
      opacity: 0; transition: all .42s cubic-bezier(.4,0,.2,1), opacity .25s, border-color .4s ease; z-index: 5;
    }
    .selbox.show { opacity: 1; }
    /* 제목 배지: selbox 윗선에 맞닿게(아래로 -100%) + 좌측 모서리를 선과 정렬. 라운드 없음. */
    .selbox .badge {
      position: absolute; bottom: 100%; left: -1.5px; background: var(--sel); color: #fff;
      font-size: 15px; font-weight: 700; line-height: 1.5; padding: 7px 16px;
      border-radius: 0; white-space: nowrap;
      transform-origin: left bottom;
      transition: background .4s ease, transform .35s cubic-bezier(.22,1,.36,1), opacity .3s ease;
    }
    /* 배지 등장: 아래서 살짝 올라오며 나타남(살아 있는 느낌) */
    .selbox .badge { opacity: 0; transform: translateY(4px) scale(.96); }
    .selbox.show .badge { opacity: 1; transform: none; }
    /* 단계별 색 — 진행 흐름이 색으로 구분된다 */
    .selbox.ph-structure { --sel: #2f6bdc; }  /* 구조 분석 — 블루 */
    .selbox.ph-hierarchy { --sel: #8b46d6; }  /* 위계 — 퍼플 */
    .selbox.ph-read      { --sel: #1f9d5b; }  /* 가독성 — 그린 */
    .selbox.ph-layout    { --sel: #d98a1f; }  /* 레이아웃 — 앰버 */
    .selbox.ph-spell     { --sel: #d6456b; }  /* 맞춤법·오타 — 핑크 */
    .selbox.ph-tidy      { --sel: #3a8fb0; }  /* 정리 — 틸 */
    .selbox.ph-verify    { --sel: #475066; }  /* 마무리 점검 — 딥 그레이 */

    /* 우: 인스펙터 (데코 최소) */
    .inspector {
      background: var(--panel); border-left: 1px solid var(--line);
      padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; overflow: auto;
    }
    .insp-h { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

    /* 현재 단계 박스 — 상단 고정, 항상 보이게 */
    .nowbox {
      position: sticky; top: -22px; z-index: 6;
      margin: -22px -20px 0; padding: 18px 20px 16px;
      background: linear-gradient(180deg, #fff 0%, #fcfdff 100%);
      border-bottom: 1px solid var(--line);
    }
    .nowbox.run { background: linear-gradient(180deg, #f3f7ff 0%, #fafcff 100%); }
    .now-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .now-phase {
      font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -.01em;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .nowbox.run .now-phase::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 0 rgba(47,107,220,.5); animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,107,220,.45)} 70%{box-shadow:0 0 0 7px rgba(47,107,220,0)} 100%{box-shadow:0 0 0 0 rgba(47,107,220,0)} }
    .now-count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* 진행 단계 체크리스트 */
    /* 진행 단계 목록 — 단계(phase)마다 캔버스 배지와 같은 색으로 구분.
       대기: 회색 · 진행 중: 단계색 레일 + 틴트 배경 + 채워진 번호 · 완료: 체크로 전환 */
    .progress-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .pgroup { --pc: var(--accent); padding: 7px 10px;
      border-radius: 6px; transition: background .35s ease; }
    .pgroup[data-ph="구조 분석"]  { --pc: #2f6bdc; }
    .pgroup[data-ph="위계"]       { --pc: #8b46d6; }
    .pgroup[data-ph="맞춤법·오타"]{ --pc: #d6456b; }
    .pgroup[data-ph="정리"]       { --pc: #3a8fb0; }
    .pgroup[data-ph="가독성"]     { --pc: #1f9d5b; }
    .pgroup[data-ph="레이아웃"]   { --pc: #d98a1f; }
    .pgroup[data-ph="마무리 점검"]{ --pc: #475066; }
    .pgroup.active { background: color-mix(in srgb, var(--pc) 6%, transparent); }
    .pgroup .pg-head { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
    .pgroup.active .pg-head { color: var(--ink); }
    .pg-head .n { font-size: 10.5px; font-weight: 700; width: 18px; height: 18px; flex: 0 0 18px;
      display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
      border: 1.5px solid #d4d8df; color: var(--muted); transition: all .3s ease; }
    .pgroup.active .pg-head .n { background: var(--pc); border-color: var(--pc); color: #fff; }
    .pgroup.done .pg-head .n { background: var(--good); border-color: var(--good); color: #fff; font-size: 0; }
    .pgroup.done .pg-head .n::before { content: '✓'; font-size: 11px; }
    .pg-head b { font-weight: 600; }
    .pgroup.active .pg-head b { color: var(--pc); font-weight: 700; }
    .pgroup.done .pg-head b { color: #7b8290; }
    .pg-head em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: auto; }
    /* 세부 항목은 진행 중인 단계에서만 펼친다 — 대기·완료 그룹은 번호+이름만 (아코디언) */
    .pg-items { list-style: none; margin: 0; padding: 0 0 0 26px; display: flex; flex-direction: column; gap: 5px;
      max-height: 0; opacity: 0; overflow: hidden;
      transition: max-height .45s ease, opacity .3s ease, margin .3s ease; }
    .pgroup.active .pg-items { max-height: 420px; opacity: 1; margin-top: 6px; }
    .pg-items li { position: relative; font-size: 12.5px; color: #aab0bb; transition: color .3s; }
    .pg-items li::before { content: ''; position: absolute; left: -13px; top: 6px; width: 5px; height: 5px;
      border-radius: 50%; background: #d4d8df; transition: background .3s; }
    .pg-items li.active { color: var(--ink); font-weight: 600;
      background: color-mix(in srgb, var(--pc) 10%, transparent); border-radius: 5px;
      margin-left: -8px; padding: 2px 8px; }
    .pg-items li.active::before { left: -5px; background: var(--pc);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 18%, transparent); }
    .pg-items li.done { color: #7b8290; }
    .pg-items li.done::before { content: '✓'; background: none; width: auto; height: auto;
      color: var(--good); font-size: 10px; font-weight: 700; top: 1px; left: -15px; }

    /* 현재 단계 근거 (nowbox 안) */
    .reasonbox { opacity: 0; transition: opacity .35s ease; }
    .reasonbox.show { opacity: 1; }
    /* 태그와 제목을 한 줄로: [type-scale] 제목 위계 적용 */
    .reasonbox .tag { display: inline; font-size: 11px; color: var(--accent); letter-spacing: .03em; font-weight: 600; margin-right: 7px; vertical-align: 1px; }
    .reasonbox h3 { display: inline; margin: 0; font-size: 15px; color: var(--ink); }
    .reasonbox .reason { margin-top: 8px; font-size: 13px; line-height: 1.65; color: #5b616c; }
    .reasonbox .ba { margin-top: 11px; font-size: 13px; font-family: ui-monospace, "SFMono-Regular", monospace; display: flex; flex-direction: column; gap: 3px; word-break: break-all; }
    .reasonbox .ba .b { color: #c0392b; } .reasonbox .ba .a { color: var(--good); }
    /* 실제 수정 항목 목록: 한 항목(− 전 / ＋ 후 / 라벨)을 한 묶음으로, 항목 사이 옅은 구분선 */
    .reasonbox .ba .ba-row { display: flex; flex-direction: column; gap: 2px; padding: 5px 0; border-top: 1px solid #eef0f3; }
    .reasonbox .ba .ba-row:first-child { border-top: none; padding-top: 2px; }
    .reasonbox .ba .ba-label { color: var(--muted); font-family: var(--font-body, sans-serif); font-size: 12px; }
    /* 항목이 많을 때 카드가 길어지지 않도록 스크롤 */
    .reasonbox .ba { max-height: 168px; overflow-y: auto; }
    .reasonbox .ref { margin-top: 9px; font-size: 11px; color: var(--muted); }

    /* 진행바 — nowbox 하단 */
    /* 진행 바 — 헤더(상단 바) 바로 아래에 전체 폭으로 */
    .bar { height: 3px; background: var(--line); overflow: hidden; flex: 0 0 auto; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s ease; }
    .foot { margin-top: auto; }
    .step-meta { font-size: 11.5px; color: var(--muted); }


    /* ───────────────────────────────────────────────
       모바일 (≤720px) — 좌우 2단 대신 세로 스택:
       위에 글 캔버스(전체폭), 아래에 인스펙터가 하단 시트로.
       데스크탑은 위 규칙 그대로 유지.
       ─────────────────────────────────────────────── */
    @media (max-width: 720px) {
      /* 고정 높이/overflow 해제 → 페이지 전체가 자연 스크롤 */
      body { height: auto; min-height: 100%; overflow: visible; }

      .topbar { padding: 11px 16px; gap: 10px; position: sticky; top: 0; z-index: 20; }
      .tagline { display: none; }                 /* 좁은 폭에선 군더더기 제거 */
      .btn { padding: 11px 18px; font-size: 13px; }   /* 터치 타깃 확보 (≥44px 근접) */

      /* 본체: 2단 그리드 → 1단 세로 스택 */
      .body { display: block; }

      /* 진행바: 스크롤해도 항상 보이도록 화면 최상단 고정 (페이지 로딩바 방식) */
      .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; }

      /* 캔버스: 전체 폭, max-width 해제로 뷰포트 폭에 맞춰 줄내림.
         상단 56px는 예시/지우기 버튼 자리, 하단 52vh는 시트(46vh)에 가리지 않을 여백 */
      .canvasWrap { padding: 56px 16px 52vh; overflow: visible; }
      .paper { max-width: none; }
      .paper.fix-measure .post { max-width: none; }  /* 모바일은 뷰포트 폭이 곧 measure */
      .sample-link { top: 14px; left: 16px; right: auto; }
      .clear-link  { top: 14px; right: 16px; }

      /* 인스펙터: 하단 고정 시트. 기본은 '현재 단계' 카드만 보이고,
         진행 단계 목록은 시트 안에서 스크롤된다. */
      .inspector {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        border-left: none; border-top: 1px solid var(--line);
        max-height: 46vh; padding: 0 16px calc(14px + env(safe-area-inset-bottom));
        border-radius: 14px 14px 0 0;
        box-shadow: 0 -8px 24px rgba(20,30,60,.10);
        gap: 12px;
        overflow-y: auto;                         /* 수정 항목·아코디언이 길어지면 시트 안에서 스크롤 */
        -webkit-overflow-scrolling: touch;
      }
      /* 시트 손잡이 */
      .inspector::before {
        content: ''; display: block; width: 38px; height: 4px; border-radius: 999px;
        background: #d6dae1; margin: 8px auto 2px; flex: 0 0 auto;
      }
      .nowbox { position: static; margin: 0; padding: 4px 0 12px; background: none; }
      .nowbox.run { background: none; }
      .insp-h { display: none; }                  /* '진행 단계' 라벨은 공간 절약 위해 숨김 */
      .progress-list { gap: 9px; }
      .foot { display: none; }                     /* 하단 메타는 nowCount와 중복 → 숨김 */
    }

    /* 아주 좁은 폭(≤380px) 추가 미세조정 */
    @media (max-width: 380px) {
      .brand { font-size: 14px; }
      .canvasWrap { padding: 18px 13px 120px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brandbox">
      <div class="brand">Better-Typo</div>
      <div class="tagline">보기 좋고, 읽기 좋은 글로 다듬어주는 스킬</div>
    </div>
    <div class="grow"></div>
    <button class="btn" id="btnGo">교정 시작
  </div>
  <div class="bar"><i id="barFill"></i></div>

  <div class="body">
    <!-- 좌: 흰 캔버스 (빈 상태 — 사용자가 자기 글을 붙여넣는다) -->
    <div class="canvasWrap">
      <div class="paper" id="paper" contenteditable="true" spellcheck="false" data-placeholder="여기에 다듬고 싶은 글을 붙여넣으세요.&#10;&#10;예) 이 글은 2026 년에 진행한 공유회의 회고입니다. 단순한 기능 구현에서 시작했지만 결국에는 글쓰기 문화 전체를 다시 보게 되었습니다...&#10;&#10;줄바꿈으로 제목·소제목·본문·목록·인용·캡션을 구분하면 더 정확히 분석합니다."></div>
      <button class="sample-link" id="loadSample" type="button">예시 글 불러오기</button>
      <button class="clear-link" id="clearAll" type="button">지우기</button>
    </div>

    <!-- 우: 인스펙터 -->
    <aside class="inspector">
      <!-- 현재 단계 + 근거: 진행 중 상단 고정으로 항상 보이게 -->
      <div class="nowbox" id="nowbox">
        <div class="now-head">
          <span class="now-phase" id="nowPhase">대기 중</span>
          <span class="now-count" id="nowCount"></span>
        </div>
        <div class="reasonbox show" id="reasonbox">
          <div class="tag" id="cardTag"></div>
          <h3 id="cardTitle">편집 준비</h3>
          <div class="reason" id="cardReason">왼쪽 캔버스의 글을 7단계로 다듬습니다. ‘교정 시작’을 누르면 현재 단계와 근거가 여기에 표시됩니다.</div>
          <div class="ba" id="cardBA"></div>
          <div class="ref" id="cardRef"></div>
        </div>
      </div>

      <div class="progress-list" id="progress"></div>

      <div class="foot">
        <div class="step-meta" id="stepMeta">대기 중</div>
      </div>
    </aside>
  </div>

  <script>
    // ════ 검출 규칙 (theory.md 재현 — 단일 기준) ════
    // 단위 집합은 theory §1 / scripts/lib/unit-rules.mjs 의 NUMBER_UNITS 와 동일.
    // 긴 단위(개월·시간·페이지)를 짧은 단위(개·시) 앞에 둬 부분 매칭 오탐 방지.
    const UNIT = '개월|시간|페이지|년|월|일|시|분|초|개|명|번|차|회|점|위|배|쪽|원|달러|%|px|em|rem|pt|kg|g|mm|cm|km|m|ml|L|주';
    const ROLE_LABEL = { title:'제목', subtitle:'부제', heading:'소제목', body:'본문', list:'목록', ref:'참고 항목', quote:'인용', caption:'캡션' };
    const ROLE_ORDER = ['title','subtitle','heading','body','list','ref','quote','caption'];
    const STEMS = '할|볼|줄|들|올|갈|날|살|말|될|쓸|길|물|풀|틀|벌';
    const TYPO = { '역활':'역할','몇일':'며칠','오랫만':'오랜만','금새':'금세','웬지':'왠지','구지':'굳이','어떻해':'어떡해','되요':'돼요','됬':'됐','바램':'바람','왠만':'웬만' };

    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // 구조 분석 (theory §5) — 역할별로 크기·웨이트·명도·들여쓰기가 갈리므로 분류가 위계의 토대다.
    // 판별 순서: 명시 마커(>·#·번호·따옴표) → 메타(캡션) → 위치(첫 줄=제목, 둘째 줄=부제) → 형태(짧고 종결 없음=소제목) → 본문.
    // subtitle(부제): 제목 바로 아래 딸림 문장 — 본문보다 옅게. heading(소제목): 본문 중간 섹션 제목 — 본문보다 진하고 굵게.
    const HEAD_END_RE = /[.!?。:：…)\]」』”"]\s*$/;               // 종결부호·콜론·닫는 괄호/인용부호로 끝나면 제목류 아님
    const SENT_END_RE = /(습니다|입니다|았다|었다|한다|이다|다|요|죠|까)\s*$/; // 문장 종결어미로 끝나면 본문
    function classify(lines){
      const out = lines.map((raw, i) => {
        let text = raw, role = 'body';
        if (/^>\s?/.test(text)) { role = 'quote'; text = text.replace(/^>\s?/, ''); }
        else if (/^[“"]/.test(text)) role = 'quote';              // 따옴표로 시작하는 발췌 인용 단락
        else if (/^#{1,6}\s/.test(text)) {                        // 마크다운 헤딩: # 제목 / ##+ 소제목
          role = (/^#\s/.test(text) && i === 0) ? 'title' : 'heading';
          text = text.replace(/^#{1,6}\s+/, '');
        }
        else if (/^(\d+[.):]|[-•*‣·]|[①-⑳])\s*\S/.test(text)) role = 'list';   // 번호·기호 목록 항목
        else if (
          /^(작성일|작성자|출처|date|by)\s*[:：]/i.test(text)      // "작성자:" 류 메타 라벨 (\b는 한글 뒤 불가 → 콜론 판별)
          || /^\d{4}[-./]\d{1,2}[-./]\d{1,2}/.test(text)           // 날짜로 시작하는 바이라인 (2026-07-28…)
          || /^\d{4}년\s*\d{1,2}월\s*\d{1,2}일/.test(text)         // 한국어 날짜 바이라인 (2026년 7월 28일…)
          || (/·/.test(text) && /\d{4}[-.]\d/.test(text))          // 구분점 + 날짜 조합 메타
        ) role = 'caption';
        else if (i === 0 && text.length <= 80) role = 'title';   // 제목은 짧다 — 긴 첫 줄(줄바꿈 없는 원문 덩어리)은 본문으로
        else if (text.length <= 60 && !HEAD_END_RE.test(text) && !SENT_END_RE.test(text))
          role = (i === 1) ? 'subtitle' : 'heading';               // 둘째 줄이면 부제, 본문 중간이면 섹션 소제목
        return { role, text };
      });
      // 표제부 관례(제목–부제–바이라인): 제목 다음 줄이 문장이라 본문 판정을 받았어도
      // 바로 뒤에 바이라인(캡션)이 오면 그 줄은 부제(deck)다.
      if (out.length >= 3 && out[1].role === 'body' && out[2].role === 'caption') out[1].role = 'subtitle';
      // 참고 자료 섹션 — "참고 자료/참고문헌/References" 소제목 뒤의 줄들은
      // 다음 소제목 전까지 출처 목록(ref)으로 재분류해 본문과 구분한다.
      let inRef = false;
      for (const b of out) {
        if (b.role === 'heading' || b.role === 'title')
          inRef = /^(참고\s*자료|참고\s*문헌|references?|출처)$/i.test(b.text.trim());
        else if (inRef && (b.role === 'body' || b.role === 'list' || b.role === 'caption'))
          b.role = 'ref';
      }
      return out;
    }

    // 비겹침 이슈 검출
    function detect(text){
      const ms = [];
      const add = (re, type) => { let m; re.lastIndex = 0;
        while ((m = re.exec(text))) { ms.push({ start:m.index, end:m.index+m[0].length, type, raw:m[0], g:m });
          if (m.index === re.lastIndex) re.lastIndex++; } };
      // 맞춤법·오타 (theory §8) — 의존명사 '수' 띄어쓰기 + 오타 사전(단일 기준)
      add(new RegExp('('+STEMS+')수(있|없)', 'g'), 'spellSpace');
      Object.keys(TYPO).forEach(k => add(new RegExp(k, 'g'), 'spellWord'));
      // 띄어쓰기 (theory §8): 날짜+글자 / 글자·숫자+여는괄호 / 닫는괄호+글자
      add(/(\d{4}-\d{1,2}-\d{1,2})([가-힣A-Za-z(])/g, 'spaceJoin');
      add(/([가-힣A-Za-z0-9])(\()/g, 'spaceJoin');
      add(/(\))([가-힣A-Za-z])/g, 'spaceJoin');
      // 문장부호/공백 (theory §7)
      // 영문 문장 첫 글자 대문자 (theory §7): 줄 맨 앞 첫 글자(소문자 영문)만 잡는다.
      // 안전 조건 — 첫 단어가 4자 이상 모두 소문자(약어·식별자 npm/iOS, 캐멀케이스 iPhone 제외)이고
      // 뒤에 공백+단어가 이어지는 일반 문장. 짧은 첫 단어나 식별자 의심은 §8(LLM)으로.
      add(/^[a-z](?=[a-z]{3,} [A-Za-z가-힣])/g, 'capitalize');
      add(/\.{3,}(?=[가-힣A-Za-z])/g, 'ellipsisJoin');  // 말줄임표 뒤에 뒷말이 붙음 → … + 띄어쓰기 (국립국어원: 뒷말과 띄움)
      add(/\.{3,}/g, 'ellipsis');
      add(/(\d+)\.\s?:/g, 'numMarker');   // 어색한 번호 마커 1.: → 1.
      add(/"([^"\n]{1,100})"/g, 'quote');
      add(/ +([.,!?;:。，、])/g, 'spacePunct');
      add(/(?<=[가-힣A-Za-z])([.,!?])(?=[가-힣A-Za-z])/g, 'spaceAfterPunct');  // 다.특히 → 다. 특히
      add(/ {2,}/g, 'doubleSpace');
      // 숫자+단위 글루 (theory §1)
      add(new RegExp('(\\d[\\d,]*)\\s('+UNIT+')(?![A-Za-z가-힣])', 'g'), 'numUnit');
      ms.sort((a,b) => a.start-b.start || b.end-a.end);
      const kept = []; let last = -1;
      for (const m of ms) if (m.start >= last) { kept.push(m); last = m.end; }
      return kept;
    }

    // 한 이슈 → 표시/적용 정보
    function inlineInfo(m, id){
      let beforeHTML, fixedHTML, before, after, category, label, ref;
      const t = m.type;
      if (t === 'doubleSpace') {
        beforeHTML = '&nbsp;'.repeat(m.raw.length); fixedHTML = ' ';
        before = '␣'.repeat(m.raw.length); after = '␣'; category='hygiene'; label='이중 공백'; ref='§7';
      } else if (t === 'spacePunct') {
        const p = m.g[1], n = m.raw.length - p.length;
        beforeHTML = '&nbsp;'.repeat(n) + esc(p); fixedHTML = esc(p);
        before = '␣'+p; after = p; category='hygiene'; label='부호 앞 공백'; ref='§7';
      } else if (t === 'ellipsisJoin') {
        beforeHTML = esc(m.raw); fixedHTML = '… '; before = m.raw+'뒷말'; after = '… 뒷말'; category='hygiene'; label='말줄임표 + 뒷말 띄어쓰기'; ref='§7';
      } else if (t === 'ellipsis') {
        beforeHTML = esc(m.raw); fixedHTML = '…'; before = m.raw; after = '…'; category='hygiene'; label='말줄임표'; ref='§7';
      } else if (t === 'numMarker') {
        const n = m.g[1]; beforeHTML = esc(m.raw); fixedHTML = esc(n+'.');
        before = m.raw; after = n+'.'; category='hygiene'; label='번호 마커 정리'; ref='§7';
      } else if (t === 'quote') {
        const inner = m.g[1]; beforeHTML = esc(m.raw); fixedHTML = '“'+esc(inner)+'”';
        before = '"…"'; after = '“…”'; category='hygiene'; label='둥근 따옴표'; ref='§7';
      } else if (t === 'numUnit') {
        const num = m.g[1], unit = m.g[2];
        beforeHTML = esc(num)+' '+esc(unit); fixedHTML = esc(num)+'&nbsp;'+esc(unit);
        before = num+'␣'+unit; after = num+' '+unit; category='glue'; label='숫자+단위'; ref='§1';
      } else if (t === 'spellSpace') {
        const fixed = m.g[1]+' 수 '+m.g[2];
        beforeHTML = esc(m.raw); fixedHTML = esc(fixed); before = m.raw; after = fixed;
        category='spell'; label='띄어쓰기(의존명사 ‘수’)'; ref='§8';
      } else if (t === 'spaceJoin') {
        const a = m.g[1], b2 = m.g[2];
        beforeHTML = esc(a)+esc(b2); fixedHTML = esc(a)+' '+esc(b2);
        before = a+b2; after = a+' '+b2; category='spell'; label='띄어쓰기'; ref='§8';
      } else if (t === 'spaceAfterPunct') {
        const p = m.raw;
        beforeHTML = esc(p); fixedHTML = esc(p)+' ';
        before = p+'붙음'; after = p+'␣'; category='hygiene'; label='부호 뒤 띄어쓰기'; ref='§7';
      } else if (t === 'capitalize') {
        const up = m.raw.toUpperCase();
        beforeHTML = esc(m.raw); fixedHTML = esc(up);
        before = m.raw+'…'; after = up+'…'; category='hygiene'; label='영문 첫 글자 대문자'; ref='§7';
      } else { // spellWord
        const fixed = TYPO[m.raw];
        beforeHTML = esc(m.raw); fixedHTML = esc(fixed); before = m.raw; after = fixed;
        category='spell'; label='맞춤법'; ref='§8';
      }
      // 하이라이트는 수정 중에만: 적용 순간 켜졌다가 잠시 후 부드럽게 사라진다
      const apply = () => { const el = document.getElementById(id); if (el){
        el.innerHTML = fixedHTML; el.classList.add('changed'); flash(el);
        setTimeout(() => el.classList.remove('changed'), 1800);
      } };
      return { beforeHTML, type:t, category, label, before, after, ref, apply };
    }

    // ════ DOM refs ════
    const paper = document.getElementById('paper');
    const reasonbox = document.getElementById('reasonbox');
    const progressEl = document.getElementById('progress');
    const barFill = document.getElementById('barFill');
    const stepMeta = document.getElementById('stepMeta');
    let STEPS = [], idx = 0, running = false, mode = 'edit', selbox = null;

    function flash(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }


    function ensureSelbox(){
      if (selbox) return selbox;
      selbox = document.createElement('div');
      selbox.className = 'selbox';
      selbox.innerHTML = '<span class="badge"></span>';
      paper.appendChild(selbox);
      return selbox;
    }
    let selboxTrackRAF = null;
    function selectEl(els, label){
      // 단일 요소·배열·NodeList 모두 허용 → 여러 블록이면 전체를 감싸는 영역으로.
      const list = (els == null) ? [] : (els.length !== undefined && typeof els !== 'string' ? [...els] : [els]);
      const targets = list.filter(Boolean);
      if (!targets.length) return;
      scrollIntoViewIfNeeded(targets[0]);
      const box = ensureSelbox();
      box.querySelector('.badge').textContent = label || '';
      box.classList.add('show');

      // 적용(위계 폰트 변경 등)에 트랜지션이 걸려 높이가 변하는 동안
      // selbox가 "적용되는 영역"을 계속 따라가도록 rAF로 추적한다.
      if (selboxTrackRAF) cancelAnimationFrame(selboxTrackRAF);
      const start = performance.now();
      const place = (now) => {
        const pr = paper.getBoundingClientRect();
        // 모든 타깃의 합집합 bounding box 계산
        let top = Infinity, left = Infinity, right = -Infinity, bottom = -Infinity;
        for (const el of targets) {
          const r = el.getBoundingClientRect();
          top = Math.min(top, r.top); left = Math.min(left, r.left);
          right = Math.max(right, r.right); bottom = Math.max(bottom, r.bottom);
        }
        box.style.top = (top - pr.top + paper.scrollTop - 4) + 'px';
        box.style.left = (left - pr.left - 5) + 'px';
        box.style.width = (right - left + 10) + 'px';
        box.style.height = (bottom - top + 8) + 'px';
        // 트랜지션(0.85s) 길이만큼 추적 후 정지
        if (now - start < 950) selboxTrackRAF = requestAnimationFrame(place);
        else selboxTrackRAF = null;
      };
      // 첫 배치는 즉시(현재 크기), 이후 rAF로 변화 추적
      place(start);
      selboxTrackRAF = requestAnimationFrame(place);
    }
    // 대상 요소가 보이는 영역 밖이면 부드럽게 스크롤.
    // 데스크탑: 캔버스(.canvasWrap) 내부 스크롤 / 모바일(세로 스택): 페이지(window) 스크롤.
    function scrollIntoViewIfNeeded(el){
      const wrap = document.querySelector('.canvasWrap');
      if (!wrap || !el) return;
      const er = el.getBoundingClientRect();
      const wrapScrollable = wrap.scrollHeight > wrap.clientHeight + 4;
      if (wrapScrollable) {
        const wr = wrap.getBoundingClientRect();
        const margin = 80; // 위아래 여유
        if (er.top < wr.top + margin || er.bottom > wr.bottom - margin) {
          const target = wrap.scrollTop + (er.top - wr.top) - (wr.height / 2 - er.height / 2);
          wrap.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
        }
      } else {
        // 모바일: 상단 sticky 헤더·하단 시트(46vh)를 피해 화면 위쪽 1/4 지점에 오도록
        const vh = window.innerHeight;
        if (er.top < 70 || er.bottom > vh * 0.5) {
          window.scrollTo({ top: Math.max(0, window.scrollY + er.top - vh * 0.25), behavior: 'smooth' });
        }
      }
    }
    function hideSel(){ if (selbox) selbox.classList.remove('show'); }

    // 고아 교정 (theory §2) — 본문 단락의 마지막 시각적 줄이 ≤4자면
    // 직전 어절 사이 공백을 nbsp로 바꿔 한 단어를 함께 끌어내린다. 해소한 단락 수 반환.
    function lastLineCharCount(el){
      // el 안의 모든 텍스트노드를 순서대로 모아(글루로 생긴 fixspan 등 자식이 섞여도)
      // 글자별 top을 측정, 마지막 시각적 줄의 글자 수를 센다.
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        if (n.textContent.length) nodes.push(n);
      }
      if (!nodes.length) return null;
      const range = document.createRange();
      let lastTop = null, lastLineChars = 0, total = 0;
      for (const node of nodes) {
        const text = node.textContent;
        for (let i = 1; i <= text.length; i++) {
          range.setStart(node, i - 1); range.setEnd(node, i);
          const rect = range.getClientRects()[0];
          if (!rect) continue;
          if (lastTop !== null && rect.top - lastTop > 1) lastLineChars = 0; // 새 줄 시작
          lastTop = rect.top;
          if (!/\s/.test(text[i - 1])) lastLineChars++; // 줄 끝 공백은 안 셈
          total++;
        }
      }
      return total ? lastLineChars : null;
    }
    function fixOrphans(){
      let fixed = 0;
      paper.querySelectorAll('.blk[data-role="body"]').forEach(el => {
        const n = lastLineCharCount(el);
        if (n === null || n === 0 || n > 4) return;       // 고아 아님
        // 마지막 공백을 nbsp로: 직전 어절을 함께 내려보낸다.
        const html = el.innerHTML;
        const lastSpace = html.lastIndexOf(' ');
        if (lastSpace === -1) return;
        el.innerHTML = html.slice(0, lastSpace) + ' ' + html.slice(lastSpace + 1);
        flash(el); fixed++;
      });
      return fixed;
    }

    // 입력 → 논리적 줄 (소프트 줄바꿈 무시)
    function getLines(){
      const clone = paper.cloneNode(true);
      const sb = clone.querySelector('.selbox'); if (sb) sb.remove();
      const txt = clone.innerHTML
        .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|blockquote|h[1-6]|li)>/gi, '\n')
        .replace(/<[^>]+>/g, '').replace(/&nbsp;/gi, ' ')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
      return txt.split(/\n/).map(s => s.trim()).filter(Boolean);
    }

    // ════ 단계 메타 ════
    // 순서 원칙 — 출판 워크플로우와 동일: 교정(텍스트 확정) → 조판(측정 기반) → 마감(재검증).
    // 글자 수를 바꾸는 맞춤법·정리가 줄바꿈 측정(가독성)보다 먼저 와야 한 단어 줄 재발이 없다.
    const PHASE_ORDER = ['구조 분석','위계','맞춤법·오타','정리','가독성','레이아웃','마무리 점검'];
    const PHASE_META = {
      '구조 분석':  { n:1, desc:'제목·소제목·본문·인용·캡션', cls:'ph-structure' },
      '위계':       { n:2, desc:'크기·웨이트·명도',            cls:'ph-hierarchy' },
      '맞춤법·오타': { n:3, desc:'띄어쓰기·맞춤법',             cls:'ph-spell' },
      '정리':       { n:4, desc:'문장부호·따옴표',              cls:'ph-tidy' },
      '가독성':     { n:5, desc:'줄내림·글루·글줄 길이·행간·리듬', cls:'ph-read' },
      '레이아웃':   { n:6, desc:'이미지 영역 제안',            cls:'ph-layout' },
      '마무리 점검': { n:7, desc:'재측정·요약',                 cls:'ph-verify' },
    };
    const PHASE_CLASSES = Object.values(PHASE_META).map(m => m.cls);

    // ════ 빌드: 입력 → 블록 + 단계 ════
    function buildModel(){
      const blocks = classify(getLines());
      // 문서 언어 감지 — 글자 중 CJK 비율 20% 미만이면 라틴 위주 문서.
      // measure·행간 기준을 theory §3·§4의 라틴 대역으로 분기한다 (keep-all·글루·고아는 공통).
      const allText = blocks.map(b => b.text).join('');
      const cjkCount = (allText.match(/[가-힣一-鿿぀-ヿ]/g) || []).length;
      const letterCount = (allText.match(/[A-Za-z가-힣一-鿿぀-ヿ]/g) || []).length;
      const latinDoc = letterCount > 0 && cjkCount / letterCount < 0.2;
      const ctx = { n:0, fixes:[] };
      let html = '';
      blocks.forEach((b, bi) => {
        const issues = detect(b.text);
        let inner = '', cur = 0;
        for (const m of issues) {
          inner += esc(b.text.slice(cur, m.start));
          const id = 'fx' + (ctx.n++);
          const info = inlineInfo(m, id);
          inner += `<span class="fixspan" id="${id}">${info.beforeHTML}</span>`;
          ctx.fixes.push(info);
          cur = m.end;
        }
        inner += esc(b.text.slice(cur));
        html += `<div class="blk" data-role="${b.role}" id="blk${bi}">${inner}</div>`;
      });

      paper.setAttribute('contenteditable', 'false');
      paper.classList.remove('fix-keepall','fix-measure','fix-leading','fix-rhythm');
      paper.classList.toggle('doc-latin', latinDoc);
      paper.innerHTML = `<div class="post" id="post">${html}</div>`;
      selbox = null;

      const steps = [];

      // ① 구조 분석 — 세부 절차로 나눠 단계별로 식별 과정을 보여준다 (theory §5 판별표)
      const counts = {};
      blocks.forEach(b => counts[b.role] = (counts[b.role]||0)+1);
      const summary = ROLE_ORDER.filter(r => counts[r]).map(r => `${ROLE_LABEL[r]} ${counts[r]}`).join(' · ');
      const snip = t => t.length > 24 ? t.slice(0, 24) + '…' : t;
      const roleEls = roles => blocks.map((b,bi) => roles.includes(b.role) ? document.getElementById('blk'+bi) : null).filter(Boolean);
      const roleItems = roles => blocks.filter(b => roles.includes(b.role))
        .map(b => ({ before: snip(b.text), after: ROLE_LABEL[b.role], label: '' }));
      const STRUCT_SUBSTEPS = [
        { roles:['title','subtitle','caption'], tag:'masthead', title:'표제부 식별',
          reason:'문서 머리를 찾습니다 — 첫 줄은 제목, 제목과 바이라인 사이의 한 줄은 부제, 날짜·작성자 라벨 형태의 줄은 바이라인(캡션)입니다. 제목–부제–바이라인 표제부 관례를 따릅니다.', contiguous:true },
        { roles:['heading'], tag:'sections', title:'섹션 소제목 식별',
          reason:'본문 중간의 짧은 줄(약 60자 이하) 중 종결어미·종결부호 없이 끝나는 줄을 섹션 소제목으로 판별합니다 — 표제는 명사(구)로 끝맺는 편집 관례에 근거합니다. ## 마커도 인식합니다.' },
        { roles:['quote'], tag:'quotes', title:'인용 식별',
          reason:'> 마커 또는 따옴표(“)로 시작하는 발췌 단락을 인용으로 분리합니다. 본문과 다른 조판(좌측 라인·들여쓰기)을 받을 대상입니다.' },
        { roles:['list'], tag:'lists', title:'목록 식별',
          reason:'번호(1.·1))·기호(-·•) 마커로 시작하는 연속 줄을 목록 덩어리로 묶습니다. 본문보다 좁은 행간과 행잉 인덴트를 받을 대상입니다.' },
        { roles:['ref'], tag:'refs', title:'참고 자료 식별',
          reason:'"참고 자료/참고문헌/References" 소제목 뒤에 이어지는 줄들을 출처 목록으로 재분류합니다 — 본문이 아닌 부속 정보로 취급합니다.' },
      ];
      STRUCT_SUBSTEPS.forEach(ss => {
        const n = blocks.filter(b => ss.roles.includes(b.role)).length;
        if (!n) return;
        steps.push({
          phase:'구조 분석', tag:ss.tag, title:ss.title,
          reason:ss.reason, before:'역할 미지정', after:`${n}개 블록 식별`, ref:'theory §5',
          items: roleItems(ss.roles),
          apply:() => {
            const els = roleEls(ss.roles);
            els.forEach(flash);                                    // 흩어진 블록은 전부 플래시로 표시
            if (ss.tag === 'masthead') {                           // 식별과 동시에 제목은 제목답게 커진다
              const t = roleEls(['title'])[0];
              if (t) t.classList.add('struct-title');
            }
            if (els.length) selectEl(ss.contiguous ? els : els[0], `${ss.title.replace(' 식별','')} ${n}`);
          }
        });
      });
      steps.push({
        phase:'구조 분석', tag:'structure', title:'구성 확정',
        reason:'모든 줄의 역할이 정해졌습니다. 이제 역할마다 크기·웨이트·명도·간격·줄내림 규칙을 다르게 적용할 토대가 완성됐습니다.',
        before:'역할 미지정 (모두 같은 회색·크기)', after: summary, ref:'theory §5',
        apply:() => selectEl(document.getElementById('post'), '구조 확정')
      });

      // ② 위계 — 존재 역할 순서대로
      const present = ROLE_ORDER.filter(r => blocks.some(b => b.role === r));
      const scaleNote = {
        title:    { reason:'제목은 스케일 최상단 크기(36px, 본문 16px의 2.25배)로 키웁니다. 폰트는 본문과 같게 두고 크기·웨이트로만 위계를 만듭니다. 큰 글자는 자간이 벌어 보이므로 -0.02em로 조이고(§6), 가장 진한 명도(#14161b)로 시선을 먼저 잡습니다.', after:'크기 36px · 웨이트 700 · 자간 -0.02em · 최진 명도', ref:'theory §5·§6·§9' },
        subtitle: { reason:'부제는 제목의 딸림 문장입니다. 스케일 한 단계 위 크기(20px = 16×1.25)·세미볼드(600)에 본문보다 한 단계 옅은 명도(#5f6675)로 보조 정보임을 드러냅니다 — 소제목과 반대 방향의 명도입니다.', after:'크기 20px · 웨이트 600 · 보조 명도(옅게)', ref:'theory §5·§9' },
        heading:  { reason:'본문 중간 소제목은 새 섹션의 시작 신호입니다. 크기는 스케일 한 단계 위(20px = 16×1.25)로만 키우고, 볼드(700)와 제목급 진한 명도, 위쪽 섹션 여백으로 구분합니다 — 크기와 웨이트만으로 위계는 충분합니다.', after:'크기 20px · 웨이트 700 · 최진 명도 · 섹션 상단 여백', ref:'theory §5·§9·§10' },
        body:     { reason:'본문은 웹 기준 크기 16px(§5 base size — 브라우저 기본값이자 모바일 하한)·기본 웨이트(400). 명도는 순흑(#000) 대신 진회색(#2b2f37)으로 눈부심·피로를 줄입니다.', after:'크기 16px · 웨이트 400 · 본문 명도(진회색)', ref:'theory §5·§9' },
        list:     { reason:'번호·기호 목록은 본문과 다른 덩어리입니다. 행간을 본문보다 좁히고(1.5), 항목 사이에는 본문 단락보다 좁은 여백(0.55em)을 두어 항목끼리 구분되면서도 목록 전체가 한 묶음으로 보이게 합니다. 마커를 왼쪽으로 내어 둘째 줄이 글머리에 맞도록 행잉 인덴트로 정렬합니다.', after:'행간 1.5 · 항목 간 0.55em · 행잉 인덴트', ref:'theory §5·§10' },
        ref:      { reason:'참고 자료·출처는 본문이 아니라 부속 정보입니다. 각주 관례에 따라 본문보다 작은 크기(14px)·보조 명도·행잉 인덴트로 한 묶음으로 정리해 본문 흐름과 분리합니다.', after:'크기 14px · 보조 명도 · 행잉 인덴트', ref:'theory §5·§9' },
        quote:    { reason:'인용은 발췌 텍스트이므로 본문보다 살짝 작게(15px) 물러나고, 좌측 라인·들여쓰기·전용 명도(#3f5d78)로 결을 구분합니다. 폰트는 본문과 동일합니다.', after:'크기 15px · 좌측 라인 · 들여쓰기 · 인용 명도', ref:'theory §5·§9' },
        caption:  { reason:'캡션·바이라인은 본문보다 살짝 작은 크기(14.5px)에 가장 옅은 명도(#9aa1ad)·약한 양수 자간(+0.01em)으로 둡니다 — 위계는 명도로 구분하고, 크기는 읽을 수 있는 하한을 지킵니다.', after:'크기 14.5px · 최옅 명도 · 자간 +0.01em', ref:'theory §5·§6·§9' },
      };
      // 역할별 스텝 이름 — 목록·참고는 위계(크기·명도)가 아니라 간격·인덴트 정돈이므로 이름을 달리한다
      const roleTitle = { list:'목록 정돈', ref:'참고 목록 정돈' };
      present.forEach(r => {
        const note = scaleNote[r];
        steps.push({
          phase:'위계', tag:'type-scale', title: roleTitle[r] || `${ROLE_LABEL[r]} 위계 적용`,
          reason:note.reason, before:'15px · 회색 · 위계 없음', after:note.after, ref:note.ref,
          apply:() => {
            const targets = [];
            blocks.forEach((b, bi) => { if (b.role === r) { const el = document.getElementById('blk'+bi); el.classList.add('on'); targets.push(el); } });
            if (targets.length) selectEl(targets, ROLE_LABEL[r]);   // 같은 역할 전체를 감싼다
          }
        });
      });

      // 인라인 수정 분류 — 텍스트를 바꾸는 교정(맞춤법·정리)이 측정 기반 교정(가독성)보다 먼저.
      const glue    = ctx.fixes.filter(f => f.type === 'numUnit');
      const spell   = ctx.fixes.filter(f => f.category === 'spell');
      const hygiene = ctx.fixes.filter(f => f.category !== 'spell' && f.type !== 'numUnit');

      // ③ 맞춤법·오타 — 텍스트 확정 1
      if (spell.length) {
        const detail = countLabel(spell);
        steps.push({ phase:'맞춤법·오타', tag:'spelling', title:'맞춤법·띄어쓰기·오타 교정',
          reason:'문맥 의존 띄어쓰기(의존명사 ‘수’·날짜/괄호 등)와 흔한 오타·맞춤법을 교정합니다. 문체는 바꾸지 않고 오류만 손봅니다. 글자 수가 바뀌는 교정이라 줄바꿈 측정(가독성)보다 먼저 확정합니다.',
          before:'교정 전', after:`${detail} — 총 ${spell.length}건`, ref:'theory §8',
          items: spell.map(f => ({ before: f.before, after: f.after, label: f.label })),
          apply:() => { selectEl(document.getElementById('post'), `맞춤법·띄어쓰기 ${spell.length}건`); spell.forEach((f,k) => setTimeout(f.apply, k*90)); } });
      }

      // ④ 정리 — 텍스트 확정 2 (문장부호/따옴표)
      if (hygiene.length) {
        const detail = countLabel(hygiene);
        steps.push({ phase:'정리', tag:'hygiene', title:'문장부호 · 공백 정리',
          reason:'이중공백·부호 앞 공백·말줄임표(…)·둥근 따옴표·영문 문장 첫 글자 대문자를 한 번에 정리합니다. 여기까지로 텍스트가 확정되고, 이후 단계는 확정된 텍스트 위에서 측정합니다.',
          before:'정리 전', after:`${detail} — 총 ${hygiene.length}건`, ref:'theory §7',
          items: hygiene.map(f => ({ before: f.before, after: f.after, label: f.label })),
          apply:() => { selectEl(document.getElementById('post'), `정리 ${hygiene.length}건`); hygiene.forEach((f,k) => setTimeout(f.apply, k*80)); } });
      }

      // ⑤ 가독성 — 확정된 텍스트 위에서 측정 기반 조판
      const bodyEl = () => paper.querySelector('.blk[data-role="body"]') || document.getElementById('post');
      steps.push({ phase:'가독성', tag:'cjk-break', title:'단어 단위 줄내림',
        reason:'줄은 단어(어절) 경계에서만 끊겨야 깔끔합니다. word-break: keep-all로 어절 중간·조사 앞 끊김을 막습니다 — 라틴 문자는 원래 단어 단위로만 끊기므로 모든 언어에 공통 적용해도 안전합니다.',
        before:'word-break: normal', after:'word-break: keep-all', ref:'theory §1',
        apply:() => { selectEl(bodyEl(), '줄내림'); paper.classList.add('fix-keepall'); } });
      // 의미 단위 glue (§1) — 끊기면 안 되는 어절 쌍(숫자+단위, 고정 복합어)을 nbsp로 묶는다.
      // detect()가 만든 numUnit fix가 곧 glue 대상이다.
      if (glue.length) {
        steps.push({ phase:'가독성', tag:'cjk-glue', title:'의미 단위 묶기',
          reason:'keep-all로도 막지 못하는 "끊기면 안 되는 곳"이 있습니다. 숫자+단위(2026 년·50 %)나 고정 복합어처럼 한 덩어리로 읽혀야 하는 어절 쌍은 줄 끝에서 갈라지지 않도록 사이 공백을 nbsp로 묶습니다.',
          before:'2026 / 년 (줄 끝에서 분리 가능)', after:`숫자+단위 등 ${glue.length}곳 nbsp로 묶음`, ref:'theory §1',
          apply:() => { selectEl(bodyEl(), `글루 ${glue.length}곳`); glue.forEach((f,k) => setTimeout(f.apply, k*120)); } });
      }
      steps.push({ phase:'가독성', tag:'measure', title:'글줄 길이',
        reason: latinDoc
          ? '라틴 본문은 한 줄 50–75자(이상적 66자)가 기준입니다. max-width 68ch로 눈이 다음 줄 시작을 쉽게 찾는 폭을 잡습니다.'
          : '한글 본문은 한 줄 25–40자가 이상적입니다. CSS의 ch는 숫자 0 폭 기준이라 한글에선 절반쯤으로 좁아져, 한글 글자폭(≈1em)에 맞춰 이상 대역 상단인 40자 폭으로 잡습니다.',
        before:'폭 제한 없음', after: latinDoc ? 'max-width 68ch (≈66자)' : 'max-width 40em (40자)', ref:'theory §3',
        apply:() => { selectEl(document.getElementById('post'), '글줄 길이'); paper.classList.add('fix-measure'); } });
      steps.push({ phase:'가독성', tag:'line-height', title:'행간',
        reason: latinDoc
          ? '라틴 본문 권장 행간은 1.5–1.6입니다. 1.6으로 맞춰 줄 사이가 편하게 흐르도록 합니다.'
          : '본문 행간 1.3은 한글에 좁습니다. 권장 1.6–1.8에 맞춰 1.78로 넓혀 눈이 편하게 흐르도록 합니다.',
        before:'line-height 1.3', after: latinDoc ? 'line-height 1.6' : 'line-height 1.78', ref:'theory §4',
        apply:() => { selectEl(bodyEl(), '행간'); paper.classList.add('fix-leading'); } });
      steps.push({ phase:'가독성', tag:'rhythm', title:'단락 세로 리듬',
        reason:'단락 사이 여백을 글자 크기에 비례해 키워 세로 운율을 만듭니다. 문단 덩어리가 분명해져 스캔이 쉬워집니다.',
        before:'문단 간격 좁음', after:'단락 간격 1.35em', ref:'theory §10',
        apply:() => { selectEl(bodyEl(), '리듬'); paper.classList.add('fix-rhythm'); } });
      // 고아(orphan) 교정 (§2) — measure·keep-all 적용 후의 실제 줄바꿈을 측정해,
      // 본문 마지막 줄에 짧은 단어 하나만 남으면(≤4자) 직전 공백을 nbsp로 묶어 동반어를 끌어내린다.
      steps.push({ phase:'가독성', tag:'orphan', title:'마지막 줄 한 단어 방지',
        reason:'문단의 마지막 줄이 「합니다.」처럼 짧은 단어 하나로만 끝나면 줄이 덜렁 떠서 문단 끝이 허전해 보입니다. 실제 줄바꿈을 측정해 이런 문단(마지막 줄 4자 이하)을 찾아, 앞 단어와의 공백을 묶어 두 단어가 함께 내려가게 합니다.',
        before:'마지막 줄: 「합니다.」 하나만', after:'마지막 줄: 「보려고 합니다.」 — 앞 단어와 동반', ref:'theory §2',
        apply:() => {
          const fixed = fixOrphans();
          selectEl(bodyEl(), fixed ? `한 단어 줄 ${fixed}곳 해소` : '해당 문단 없음');
        } });

      // ④ 레이아웃 — 이미지 영역 제안 (theory §11)
      // 개수: 본문 약 1,000자당 1곳, 최대 4곳. 위치: 섹션 전환점(소제목 앞) 우선,
      // 전체 분량을 (개수+1) 등분한 지점에 가장 가까운 후보를 골라 고르게 배분한다.
      const bodyIdx = blocks.map((b,i) => b.role==='body' ? i : -1).filter(i => i>=0);
      const bodyChars = blocks.reduce((s,b) => s + (b.role==='body' ? b.text.length : 0), 0);
      if (bodyIdx.length >= 2) {
        const imgN = Math.max(1, Math.min(4, Math.round(bodyChars / 1000)));
        // 블록별 누적 글자 위치 → 삽입 후보(소제목 = 섹션 전환점 우선, 그 외 본문 문단 앞)
        let acc = 0;
        const pos = blocks.map(b => { const p = acc; acc += b.text.length; return p; });
        const cands = [];
        blocks.forEach((b,i) => {
          if (i === 0) return;
          if (b.role === 'heading') cands.push({ i, at: pos[i], sec: true });
          else if (b.role === 'body') cands.push({ i, at: pos[i], sec: false });
        });
        const chosen = [];
        for (let k = 1; k <= imgN; k++) {
          const target = acc * k / (imgN + 1);
          let best = null;
          for (const c of cands) {
            if (chosen.includes(c.i)) continue;
            const d = Math.abs(c.at - target) - (c.sec ? acc * 0.08 : 0);  // 섹션 전환점 가산점 (§11 우선순위 1)
            if (!best || d < best.d) best = { i: c.i, d };
          }
          if (best) chosen.push(best.i);
        }
        chosen.sort((a,b) => a - b);
        steps.push({ phase:'레이아웃', tag:'layout', title:'이미지 영역 제안',
          reason:`본문이 길게 이어지면 시선이 지칩니다. 본문 분량(약 ${bodyChars.toLocaleString()}자)에 맞춰 1,000자당 1곳 — 총 ${chosen.length}곳을, 의미가 전환되는 소제목 앞을 우선해 16:9 영역으로 제안합니다(실제 이미지는 사람이 채움).`,
          before:'이미지 자리 없음 (긴 텍스트 블록)', after:`16:9 영역 ${chosen.length}곳 제안 (본문 ${bodyChars.toLocaleString()}자)`, ref:'theory §11',
          apply:() => {
            const phs = [];
            chosen.forEach((bi, k) => {
              const target = document.getElementById('blk'+bi);
              if (!target) return;
              let ph = document.getElementById('imgph'+k);
              if (!ph) { ph = document.createElement('div'); ph.className = 'imgph'; ph.id = 'imgph'+k;
                ph.innerHTML = '<span>이미지 영역 제안 · 16:9</span>'; target.parentNode.insertBefore(ph, target); }
              setTimeout(() => ph.classList.add('show'), k*160);
              phs.push(ph);
            });
            if (phs.length) selectEl(phs[0], `이미지 영역 ${phs.length}곳`);
          } });
      }

      // ⑦ 마무리 점검 — 실제 스킬의 re-verify 단계: 최종 상태를 재측정해 확인
      steps.push({ phase:'마무리 점검', tag:'re-verify', title:'마무리 점검',
        reason:'모든 교정이 끝난 최종 상태에서 줄바꿈을 다시 측정합니다. 앞 단계들의 변화로 마지막 줄에 한 단어만 남은 문단이 새로 생겼으면 추가로 묶고, 전체 교정 내역을 확정합니다.',
        before:'적용 직후 (미검증)',
        after:`재측정 완료 — 맞춤법 ${spell.length} · 정리 ${hygiene.length} · 글루 ${glue.length}건 확정`,
        ref:'pipeline re-verify · theory §2',
        apply:() => {
          const residual = fixOrphans();
          selectEl(document.getElementById('post'), residual ? `추가 교정 ${residual}곳` : '잔여 문제 없음');
        } });

      return { steps, blocks };
    }
    function countLabel(fixes){
      const c = {}; fixes.forEach(f => c[f.label] = (c[f.label]||0)+1);
      return Object.keys(c).map(k => `${k} ${c[k]}`).join(' · ');
    }

    // ════ 진행 표시 ════
    function renderProgress(steps){
      let html = '';
      PHASE_ORDER.forEach(ph => {
        const items = steps.map((s,k) => ({s,k})).filter(o => o.s.phase === ph);
        if (!items.length) return;
        const m = PHASE_META[ph];
        html += `<div class="pgroup" data-ph="${ph}"><div class="pg-head"><span class="n">${m.n}</span><b>${ph}</b></div>`
              + `<ul class="pg-items">` + items.map(o => `<li id="sli${o.k}">${esc(o.s.title)}</li>`).join('') + `</ul></div>`;
      });
      progressEl.innerHTML = html;
    }
    function renderOutline(){
      progressEl.innerHTML = PHASE_ORDER.map(ph => {
        const m = PHASE_META[ph];
        return `<div class="pgroup" data-ph="${ph}"><div class="pg-head"><span class="n">${m.n}</span><b>${ph}</b><em>${m.desc}</em></div></div>`;
      }).join('');
    }
    function updateProgress(i){
      STEPS.forEach((s,k) => { const li = document.getElementById('sli'+k); if (!li) return;
        li.classList.toggle('done', k < i); li.classList.toggle('active', k === i); });
      const cur = STEPS[i] ? STEPS[i].phase : null;
      document.querySelectorAll('.pgroup').forEach(g => {
        const ph = g.getAttribute('data-ph');
        const idxs = STEPS.map((s,k) => s.phase===ph ? k : -1).filter(k => k>=0);
        g.classList.toggle('active', ph === cur);
        g.classList.toggle('done', idxs.length>0 && idxs.every(k => k < i));
      });
    }
    function markAllDone(){
      STEPS.forEach((s,k) => { const li = document.getElementById('sli'+k); if (li){ li.classList.add('done'); li.classList.remove('active'); } });
      document.querySelectorAll('.pgroup').forEach(g => { g.classList.add('done'); g.classList.remove('active'); });
    }

    // ════ 재생 ════
    function showCard(s, i){
      updateProgress(i);
      // 현재 단계 배너 (상단 고정) — 항상 보이게
      document.getElementById('nowPhase').textContent = s.phase;
      document.getElementById('nowCount').textContent = `${i+1} / ${STEPS.length}`;
      reasonbox.classList.remove('show');
      setTimeout(() => {
        document.getElementById('cardTag').textContent = s.tag;
        document.getElementById('cardTitle').textContent = s.title;
        document.getElementById('cardReason').textContent = s.reason;
        // 실제 수정 항목이 있으면 개별 before→after 목록으로, 없으면 단일 before/after 요약으로.
        const ba = document.getElementById('cardBA');
        if (s.items && s.items.length) {
          ba.innerHTML = s.items.map(it =>
            `<span class="ba-row"><span class="b">− ${esc(it.before)}</span><span class="a">＋ ${esc(it.after)}</span>`
            + (it.label ? `<span class="ba-label">${esc(it.label)}</span>` : '') + `</span>`
          ).join('');
        } else {
          ba.innerHTML = `<span class="b">− ${s.before}</span><span class="a">＋ ${s.after}</span>`;
        }
        document.getElementById('cardRef').textContent = s.ref;
        stepMeta.textContent = `${i+1} / ${STEPS.length} · ${s.phase}`;
        reasonbox.classList.add('show');
      }, 150);
    }

    // 캔버스가 비었는지 — placeholder 토글 + '교정 시작' 활성 제어의 단일 기준
    function paperIsEmpty(){
      // selbox 같은 보조 요소를 제외한 실제 텍스트만 본다.
      const clone = paper.cloneNode(true);
      const sb = clone.querySelector('.selbox'); if (sb) sb.remove();
      return clone.textContent.replace(/ /g,' ').trim().length === 0;
    }
    function syncEmptyState(){
      const empty = (mode === 'edit') && paperIsEmpty();
      paper.classList.toggle('is-empty', empty);
      refreshGo();
    }

    function refreshGo(){
      const b = document.getElementById('btnGo');
      if (mode === 'edit')         { b.textContent = '교정 시작'; b.disabled = paperIsEmpty(); }
      else if (mode === 'running') { b.textContent = '진행 중…';        b.disabled = true;  }
      else if (mode === 'done')    { b.textContent = '↺ 다시 편집';     b.disabled = false; }
      // 지우기 버튼: 편집 중 글이 있을 때, 또는 교정 완료 후에만 노출
      const c = document.getElementById('clearAll');
      if (c) c.style.display = ((mode === 'edit' && !paperIsEmpty()) || mode === 'done') ? 'block' : 'none';
    }
    function onGo(){ if (mode==='edit'){ if (paperIsEmpty()) return; improve(); } else if (mode==='done') editMode(); }

    // 예시 글 불러오기 — 비었을 때 데모용 샘플을 채운다(줄 단위 구조 포함)
    // 예시 글 — 7단계 전 항목이 발동되도록 설계된 픽스처:
    // 표제부(제목·부제·바이라인) / 섹션 소제목 2 / 목록 / 인용 / 참고 자료 / 캡션,
    // 오타(역활·몇일)·의존명사(할수있)·날짜/괄호 붙음, 이중 공백·부호 앞 공백·말줄임표·
    // 곧은따옴표·다.특히·1.: 마커·영문 소문자 문장, 숫자+단위 글루(2026 년·50 %·3 개)
    const SAMPLE_LINES = [
      '단순 구현에서 블로그 문화 루프를 보기까지',
      '기능 하나를 만들다 팀의 글쓰기 문화를 다시 보게 된 회고',

      '처음에는 개발자의 역활이 코드 작성에만 있다고 생각했지만, 여러 사람과 대화하고 회의를 거치면서 이 일이 글쓰기 문화 전체를 바꾸는 일이라는 걸 직접 확인할수있었습니다...몇일 지나지 않아 첫 글이 나오게 됬습니다.',
      '프로세스를 정리하며 발견한 것',

      '> 좋은 문서는 내용만으로 완성되지 않는다. 읽는 사람의 눈이 편하게 흐르도록 다듬는 마지막 한 끗이 퀄리티를 만든다.',
      '남은 과제와 다음 실험',
      'these tools are not perfect yet. 영문 초안 도구는 웬지 어색한 문장을 만들 때가 있어서, 한 문단씩 사람이 검토하는 흐름은 그대로 유지해야 되요.',
      '다음 분기에는 글감 수집을 슬랙 봇으로 옮기고, 리뷰어 배정을 자동화하며, 발행 후 반응 데이터를 대시보드로 모으는 실험을 계획하고 있습니다. 오랫만에 팀 전체가 같은 방향을 보게 된 만큼, 이 흐름이 계속되면 좋겠다는 바램입니다. 문화는 강요로 만들어지지 않고, 좋은 경험이 반복될 때 생겨나기 때문입니다. 그래서 우리는 약 3 개의 실험을 작게 나눠 하나씩 검증하기로 했습니다.',
      '참고 자료',
      '국립국어원, 「한글 맞춤법」 문화체육관광부 고시(2017)',

      'W3C, 「한국어 조판 요구사항 KLREQ」(2020)',

    function loadSample(){
      if (mode !== 'edit') editMode();
      paper.innerHTML = SAMPLE_LINES.map(l => `<div>${esc(l)}</div>`).join('');
      syncEmptyState();
      paper.focus();
    }

    // 단계(phase) 그룹을 즉시 완료 표시 — "완료" 보이스와 화면 싱크용
    function markPhaseDone(ph){
      document.querySelectorAll('.pgroup').forEach(g => {
        if (g.getAttribute('data-ph') === ph) { g.classList.add('done'); g.classList.remove('active'); }
      });
      STEPS.forEach((s,k) => { if (s.phase === ph) { const li = document.getElementById('sli'+k);
        if (li) { li.classList.add('done'); li.classList.remove('active'); } } });
    }

    function next(){
      if (idx >= STEPS.length){ finish(); return; }
      const s = STEPS[idx];
      // 직전 스텝과 phase가 다르면 한 단계가 막 끝난 것:
      // 이전 단계를 화면에서 done 처리하고 잠깐 쉰 뒤 새 액션 카드를 보여준다.
      const phaseEnded = idx > 0 && STEPS[idx - 1].phase !== s.phase;
      if (phaseEnded) markPhaseDone(STEPS[idx - 1].phase);
      const stepIdx = idx;
      setTimeout(() => {
        showCard(s, stepIdx);
        // 단계 색으로 가이드라인/배지 전환 — 진행 흐름이 색으로 구분된다.
        const box = ensureSelbox();
        box.classList.remove(...PHASE_CLASSES);
        const cls = PHASE_META[s.phase]?.cls;
        if (cls) box.classList.add(cls);
        setTimeout(() => s.apply(), 1300);   // 카드 먼저 읽히고 → 적용(여유 있게)
      }, phaseEnded ? 900 : 0);
      idx++;
      barFill.style.width = (idx / STEPS.length * 100) + '%';
    }
    // 클릭 한 번 → 전 과정 자동 진행
    function runAll(){
      if (idx >= STEPS.length){ finish(); return; }
      mode = 'running'; refreshGo();
      document.getElementById('nowbox').classList.add('run');
      (function tick(){
        if (idx >= STEPS.length){ finish(); return; }
        next();
        setTimeout(tick, 2600);   // 단계 전환을 여유 있게 — 변화가 충분히 보이고 보이스 안내도 끝나도록
      })();
    }
    function finish(){
      running = false; mode = 'done'; refreshGo();
      hideSel(); markAllDone();
      // 최종본은 깨끗하게 — 진행 중 남겨둔 변경 하이라이트를 부드럽게 걷어낸다
      paper.querySelectorAll('.fixspan.changed').forEach(el => el.classList.remove('changed'));
      document.getElementById('nowbox').classList.remove('run');
      document.getElementById('nowPhase').textContent = '완료';
      document.getElementById('nowCount').textContent = `${STEPS.length} / ${STEPS.length}`;
      stepMeta.textContent = `완료 · ${STEPS.length}개 항목 적용`;
      // 완료되면 마지막 단계의 before/after 상세 카드는 더 이상 의미가 없으므로 거두고,
      // 완료 안내로 교체한다(진행 중에만 단계별 근거·수정 항목을 보여준다).
      document.getElementById('cardTag').textContent = '';
      document.getElementById('cardTitle').textContent = '다듬기 완료';
      document.getElementById('cardReason').textContent = `${STEPS.length}개 단계를 적용했습니다. ‘↺ 다시 편집’으로 글을 수정하거나 새 글로 다시 시작할 수 있습니다.`;
      document.getElementById('cardBA').innerHTML = '';
      document.getElementById('cardRef').textContent = '';
      // 완료되면 결과 전체를 처음부터 보도록 맨 위로 정렬 (데스크탑: 캔버스 / 모바일: 페이지)
      const wrap = document.querySelector('.canvasWrap');
      if (wrap) wrap.scrollTo({ top: 0, behavior: 'smooth' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function improve(){
      const r = buildModel();
      STEPS = r.steps; idx = 0;
      renderProgress(STEPS);
      barFill.style.width = '0';
      stepMeta.textContent = `7단계 · ${STEPS.length}개 항목`;
      runAll();   // 클릭 한 번에 끝까지
    }
    function editMode(){
      running = false; mode = 'edit'; refreshGo();
      const lines = Array.from(paper.querySelectorAll('.blk')).map(b => {
        const role = b.getAttribute('data-role'); const t = b.textContent;
        return role === 'quote' ? '> ' + t : t;
      });
      paper.innerHTML = lines.length ? lines.map(l => `<div>${esc(l)}</div>`).join('') : '';
      paper.setAttribute('contenteditable', 'true');
      paper.classList.remove('fix-keepall','fix-measure','fix-leading','fix-rhythm');
      selbox = null;
      barFill.style.width = '0';
      stepMeta.textContent = '편집 모드 — 글을 붙여넣은 뒤 ‘교정 시작’';
      document.getElementById('nowbox').classList.remove('run');
      document.getElementById('nowPhase').textContent = '대기 중';
      document.getElementById('nowCount').textContent = '';
      renderOutline();
      document.getElementById('cardTag').textContent = '';
      document.getElementById('cardTitle').textContent = '편집 준비';
      document.getElementById('cardReason').textContent = '왼쪽 캔버스에 다듬고 싶은 글을 붙여넣고 ‘교정 시작’을 누르세요. 7단계로 다듬으며 각 단계의 근거가 여기에 표시됩니다.';
      document.getElementById('cardBA').innerHTML = '';
      document.getElementById('cardRef').textContent = '';
      reasonbox.classList.add('show');
      syncEmptyState();
      paper.focus();
    }

    document.getElementById('btnGo').addEventListener('click', onGo);
    document.getElementById('loadSample').addEventListener('click', loadSample);
    // 지우기: 편집 모드로 되돌린 뒤 캔버스를 비운다 (진행 중에는 동작 안 함)
    document.getElementById('clearAll').addEventListener('click', () => {
      if (mode === 'running') return;
      if (mode !== 'edit') editMode();
      paper.innerHTML = '';
      syncEmptyState();
      paper.focus();
    });
    // 붙여넣기는 항상 서식 없는 텍스트로 — 원본 서식(폰트·색·태그)이 분류·조판을 오염시키지 않게.
    // 이모지는 글쓴이가 의도적으로 넣었을 수 있으므로 그대로 보존한다.
    // 줄바꿈은 <div> 단위로 보존해 classify()의 논리적 줄 구조를 유지한다.
    paper.addEventListener('paste', (e) => {
      if (paper.getAttribute('contenteditable') !== 'true') return;
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      if (!text) return;
      const html = text.split(/\r?\n/).map(l => `<div>${esc(l) || '<br>'}</div>`).join('');
      document.execCommand('insertHTML', false, html);
      syncEmptyState();
    });
    // 입력할 때마다 빈 상태(placeholder·버튼 활성)를 동기화
    paper.addEventListener('input', syncEmptyState);
    renderOutline();
    reasonbox.classList.add('show');
    syncEmptyState();
  </script>
</body>
</html>
